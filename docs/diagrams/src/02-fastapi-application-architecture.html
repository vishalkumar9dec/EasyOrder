<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>EasyOrder — FastAPI Application Architecture</title>
<style> html, body { margin: 0; padding: 0; background: #fff; } </style>
<link rel="stylesheet" href="_diagram.css" />
</head>
<body>
<svg width="1120" height="900" viewBox="0 0 1120 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368" />
    </marker>
    <marker id="arrow-start" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368" />
    </marker>
    <marker id="arrow-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa0a6" />
    </marker>
  </defs>

  <rect class="bg" width="1120" height="900" />

  <text class="h1" x="560" y="40">Detailed Architecture A — <tspan class="h1-light">FastAPI Application</tspan></text>
  <text class="h2" x="560" y="62">Ingress → routers → services → adapters → the outside world. Every adapter has a Protocol and a mock.</text>

  <!-- ══════════ PANELS ══════════ -->
  <rect class="panel p-external" x="24" y="112" width="226" height="330" />
  <text class="panel-title" x="137" y="134">INGRESS</text>

  <rect class="panel p-server" x="282" y="112" width="418" height="560" />
  <text class="panel-title" x="491" y="134">APPLICATION CORE</text>

  <rect class="panel p-neutral" x="732" y="112" width="170" height="560" />
  <text class="panel-title" x="817" y="134">ADAPTERS</text>

  <rect class="panel p-store" x="934" y="112" width="162" height="560" />
  <text class="panel-title" x="1015" y="134">OUTSIDE</text>

  <rect class="panel p-auth" x="24" y="706" width="1072" height="130" />
  <text class="panel-title" x="560" y="728">AUTHORIZATION — who is allowed to do what</text>

  <!-- ══════════ INGRESS ══════════ -->
  <rect class="node" x="40" y="150" width="194" height="62" />
  <text class="n-mono" x="52" y="172">GET /api/whatsapp/webhook</text>
  <text class="n-sub" x="52" y="192">Meta challenge · verify token</text>

  <rect class="node a-guard node-accent" x="40" y="234" width="194" height="104" />
  <text class="n-mono" x="52" y="256">POST /api/whatsapp/webhook</text>
  <text class="n-sub" x="52" y="276">HMAC signature check</text>
  <text class="n-sub" x="52" y="294">Business-number filter</text>
  <text class="n-sub" x="52" y="312">Replay suppression</text>

  <rect class="node" x="40" y="360" width="194" height="66" />
  <text class="n-title" x="52" y="382">Middleware</text>
  <text class="n-sub" x="52" y="400">JSON logs · /metrics</text>
  <text class="n-sub" x="52" y="416">OTP limit 3/phone · 30/IP</text>

  <!-- ══════════ CORE ══════════ -->
  <rect class="node" x="298" y="150" width="386" height="72" />
  <text class="n-title" x="312" y="172">Routers</text>
  <text class="n-mono" x="312" y="192">whatsapp · session · account · short_links</text>
  <text class="n-sub" x="312" y="212">Session reads resolve a role from the token on every call</text>

  <rect class="node a-llm node-accent" x="298" y="250" width="386" height="60" />
  <text class="n-title" x="312" y="272">Intent router</text>
  <text class="n-sub" x="312" y="292">Regex → intent family, before any model call</text>

  <rect class="node a-food node-accent" x="298" y="338" width="386" height="76" />
  <text class="n-title" x="312" y="360">Agent service · LangGraph</text>
  <text class="n-sub" x="312" y="380">Group sessions: runs the node graph, persists</text>
  <text class="n-sub" x="312" y="398">the cart, returns host token material</text>

  <rect class="node a-food node-accent" x="298" y="442" width="386" height="76" />
  <text class="n-title" x="312" y="464">Targeted order service</text>
  <text class="n-sub" x="312" y="484">Menu match · budget gate · deadline →</text>
  <text class="n-mono" x="312" y="504">target_placement_at</text>

  <rect class="node a-store node-accent" x="298" y="546" width="386" height="100" />
  <text class="n-title" x="312" y="568">Scheduler · profile builder · privacy</text>
  <text class="n-sub" x="312" y="588">Places due orders every 30s</text>
  <text class="n-sub" x="312" y="606">Derives preferences from committed history</text>
  <text class="n-sub" x="312" y="624">Erases every record on confirmed request</text>

  <!-- ══════════ ADAPTERS ══════════ -->
  <rect class="node a-store node-accent" x="744" y="150" width="146" height="72" />
  <text class="n-title" x="756" y="172">DB adapter</text>
  <text class="n-sub" x="756" y="190">asyncpg pool</text>
  <text class="n-sub" x="756" y="208">or in-memory</text>

  <rect class="node a-food node-accent" x="744" y="254" width="146" height="72" />
  <text class="n-title" x="756" y="276">Swiggy client</text>
  <text class="n-sub" x="756" y="294">MCP over HTTP</text>
  <text class="n-sub" x="756" y="312">or in-process mock</text>

  <rect class="node a-llm node-accent" x="744" y="358" width="146" height="72" />
  <text class="n-title" x="756" y="380">Intent parser</text>
  <text class="n-sub" x="756" y="398">OpenAI schema</text>
  <text class="n-sub" x="756" y="416">or regex fallback</text>

  <rect class="node" x="744" y="462" width="146" height="72" />
  <text class="n-title" x="756" y="484">WhatsApp sender</text>
  <text class="n-sub" x="756" y="502">Meta Cloud API</text>
  <text class="n-sub" x="756" y="520">or captured mock</text>

  <!-- ══════════ OUTSIDE ══════════ -->
  <rect class="node a-store node-accent" x="946" y="150" width="138" height="72" />
  <text class="n-title" x="958" y="172">PostgreSQL</text>
  <text class="n-sub" x="958" y="192">sessions · orders</text>
  <text class="n-sub" x="958" y="210">cart_items · events</text>

  <rect class="node a-food node-accent" x="946" y="254" width="138" height="72" />
  <text class="n-title" x="958" y="276">Swiggy MCP</text>
  <text class="n-sub" x="958" y="296">search · cart</text>
  <text class="n-sub" x="958" y="314">place order</text>

  <rect class="node a-llm node-accent" x="946" y="358" width="138" height="72" />
  <text class="n-title" x="958" y="380">OpenAI</text>
  <text class="n-sub" x="958" y="400">optional</text>
  <text class="n-mono" x="958" y="418">LLM_MODE</text>

  <rect class="node" x="946" y="462" width="138" height="72" />
  <text class="n-title" x="958" y="484">Meta</text>
  <text class="n-sub" x="958" y="504">Cloud API</text>
  <text class="n-sub" x="958" y="522">templates · text</text>

  <!-- ══════════ AUTH ══════════ -->
  <rect class="node a-guard node-accent" x="44" y="742" width="330" height="80" />
  <text class="n-title" x="58" y="764">Host token</text>
  <text class="n-mono" x="58" y="784">host_&lt;urlsafe32&gt; · stored as SHA-256</text>
  <text class="n-sub" x="58" y="804">Private channel only. Checkout, confirm, OAuth.</text>

  <rect class="node" x="396" y="742" width="330" height="80" />
  <text class="n-title" x="410" y="764">Guest token</text>
  <text class="n-mono" x="410" y="784">guest_&lt;urlsafe24&gt; · safe to forward</text>
  <text class="n-sub" x="410" y="804">Read and cart edits. Checkout returns 403.</text>

  <rect class="node a-auth node-accent" x="748" y="742" width="330" height="80" />
  <text class="n-title" x="762" y="764">Web session</text>
  <text class="n-mono" x="762" y="784">httponly cookie ← WhatsApp OTP</text>
  <text class="n-sub" x="762" y="804">Scopes every /api/me/* read to one wa_id.</text>

  <!-- ══════════ EDGES ══════════ -->

  <!-- ingress → routers -->
  <path class="edge" d="M 234 181 H 262 V 176 H 298" />
  <path class="edge" d="M 234 286 H 262 V 190 H 298" />
  <circle class="badge" cx="262" cy="230" r="8" /><text class="badge-text" x="262" y="233.5">1</text>

  <!-- middleware wraps every request -->
  <path class="edge-dashed" d="M 234 393 H 274 V 200 H 298" />
  <text class="e-label-sub" x="240" y="356">every request</text>

  <!-- routers → intent router -->
  <path class="edge" d="M 491 222 V 250" />
  <circle class="badge" cx="473" cy="236" r="8" /><text class="badge-text" x="473" y="239.5">2</text>

  <!-- intent router → agent service -->
  <path class="edge" d="M 420 310 V 338" />
  <text class="e-label-sub" x="428" y="329">group order</text>

  <!-- intent router → targeted order (routed down the left margin) -->
  <path class="edge" d="M 298 280 H 288 V 480 H 298" />
  <text class="e-label-sub" x="292" y="400" transform="rotate(-90 292 400)" text-anchor="middle">targeted order</text>

  <!-- services → scheduler / profile -->
  <path class="edge-dashed" d="M 600 518 V 546" />
  <text class="e-label-sub" x="608" y="538">schedules</text>

  <!-- core → adapters (one per adapter) -->
  <path class="edge-both" d="M 684 186 H 744" />
  <path class="edge-both" d="M 684 290 H 744" />
  <path class="edge-both" d="M 684 394 H 744" />
  <path class="edge-both" d="M 684 498 H 744" />

  <!-- adapters → outside -->
  <path class="edge-both" d="M 890 186 H 946" />
  <path class="edge-both" d="M 890 290 H 946" />
  <path class="edge-both" d="M 890 394 H 946" />
  <path class="edge-both" d="M 890 498 H 946" />
  <text class="e-label-sub" x="918" y="600" text-anchor="middle">real or mock,</text>
  <text class="e-label-sub" x="918" y="614" text-anchor="middle">selected by env</text>

  <!-- routers gated by tokens -->
  <path class="edge-dashed" d="M 692 222 V 690 H 560 V 706" />
  <text class="e-label-sub" x="700" y="450" transform="rotate(-90 700 450)" text-anchor="middle">role resolved per request</text>

  <!-- ══════════ FOOTNOTE ══════════ -->
  <rect class="note-box" x="24" y="850" width="1072" height="42" />
  <text class="note-text" x="38" y="869">
    <tspan class="note-bold">No Firebase anywhere.</tspan> No Firestore adapter, no Anonymous Auth, no security-rule evaluation — ADR 0006 replaced client auth with WhatsApp OTP,
  </text>
  <text class="note-text" x="38" y="885">
    and ADR 0007 moved authorization into the application, where <tspan class="note-bold">make security-smoke</tspan> blocks any release that breaks it.
  </text>
</svg>
</body>
</html>
